<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>The Foxglove Cottage</title>
<style>
  :root { color-scheme: dark; --ink:#f3ecd8; --moss:#7fa07a; --night:#0d1424; }
  html, body { height:100%; margin:0; background:var(--night); color:var(--ink); font-family: Georgia, "Times New Roman", serif; }
  a-scene { position:absolute; inset:0; }
  .card { position:fixed; left:16px; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); max-width:420px; z-index:10;
          background:rgba(13,20,36,.78); border:1px solid rgba(127,160,122,.45); border-radius:10px; padding:12px 14px; font-size:14px; line-height:1.45; }
  .card h1 { margin:0 0 4px; font-size:18px; font-weight:normal; letter-spacing:.02em; color:#e8d9a8; }
  .card p { margin:0; }
  .card button { margin-top:8px; background:#2b3a2e; color:var(--ink); border:1px solid var(--moss); border-radius:6px; padding:5px 10px; font:inherit; cursor:pointer; }
  .card button:focus-visible { outline:2px solid #e8d9a8; outline-offset:2px; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
<script>
// Scatter helpers: stars, foxgloves, fireflies. Seeded so the garden is the same every visit.
function rng(seed){ return function(){ seed = (seed*16807) % 2147483647; return (seed-1)/2147483646; }; }
AFRAME.registerComponent('starfield', { init(){ const r=rng(7); for(let i=0;i<260;i++){ const th=r()*Math.PI*2, ph=r()*Math.PI*0.45, R=90;
  const s=document.createElement('a-sphere'); s.setAttribute('radius', (0.08+r()*0.18).toFixed(2));
  s.setAttribute('position', `${(R*Math.cos(th)*Math.cos(ph)).toFixed(1)} ${(8+R*Math.sin(ph)).toFixed(1)} ${(R*Math.sin(th)*Math.cos(ph)).toFixed(1)}`);
  s.setAttribute('material','shader:flat; color:#fff8e0'); this.el.appendChild(s);} } });
function foxglove(x,z,h,r){ const g=document.createElement('a-entity'); g.setAttribute('position',`${x} 0 ${z}`);
  const stem=document.createElement('a-cylinder'); stem.setAttribute('radius','0.02'); stem.setAttribute('height',h); stem.setAttribute('position',`0 ${h/2} 0`); stem.setAttribute('color','#3f6b3a'); g.appendChild(stem);
  const n=6+Math.floor(r()*4); for(let i=0;i<n;i++){ const b=document.createElement('a-cone'); const y=h*0.45+i*(h*0.55/n);
    b.setAttribute('radius-bottom', (0.07-i*0.005).toFixed(3)); b.setAttribute('radius-top','0.025'); b.setAttribute('height','0.11');
    b.setAttribute('position', `${(Math.cos(i*2.1)*0.05).toFixed(3)} ${y.toFixed(2)} ${(Math.sin(i*2.1)*0.05).toFixed(3)}`); b.setAttribute('rotation','180 0 0');
    b.setAttribute('color', ['#7b3f8c','#8e4fa3','#6a2f7a','#a067b5'][i%4]); g.appendChild(b); }
  return g; }
AFRAME.registerComponent('foxglove-beds', { init(){ const r=rng(11);
  const beds=[[-3.2,1.5,9],[3.2,1.5,9],[-2.6,-3.4,6],[2.6,-3.4,6],[-6,4,8],[6.5,3,8],[8.5,-6,7],[-9,-2,7]];
  beds.forEach(([cx,cz,n])=>{ for(let i=0;i<n;i++){ this.el.appendChild(foxglove((cx+(r()-.5)*1.6).toFixed(2),(cz+(r()-.5)*1.2).toFixed(2),(0.9+r()*0.6).toFixed(2),r)); } });
  // window box foxgloves under the front windows
  [[-1.8,-2.62],[1.8,-2.62]].forEach(([x,z])=>{ for(let i=0;i<4;i++){ const f=foxglove((x-0.45+i*0.3).toFixed(2), z, 0.55, r); f.object3D.position.y=1.15; f.object3D.scale.set(0.7,0.7,0.7); this.el.appendChild(f);} });
} });
AFRAME.registerComponent('fireflies', { init(){ const r=rng(23); this.f=[]; for(let i=0;i<40;i++){ const s=document.createElement('a-sphere');
  s.setAttribute('radius','0.035'); s.setAttribute('material','shader:flat; color:#f6e27a'); const base={x:(r()-.5)*24,y:0.6+r()*1.8,z:(r()-.5)*24,p:r()*6};
  s.object3D.position.set(base.x,base.y,base.z); this.el.appendChild(s); this.f.push([s,base]); } },
  tick(t){ const k=t/1000; this.f.forEach(([s,b])=>{ s.object3D.position.set(b.x+Math.sin(k*0.5+b.p)*0.6, b.y+Math.sin(k*0.9+b.p)*0.25, b.z+Math.cos(k*0.4+b.p)*0.6);
    s.object3D.visible = Math.sin(k*1.7+b.p*3) > -0.35; }); } });
</script>

<a-scene renderer="antialias:true; colorManagement:true" fog="type:exponential; color:#101a2e; density:0.035" vr-mode-ui="enabled:true" loading-screen="dotsColor:#e8d9a8; backgroundColor:#0d1424">
  <a-sky color="#0f1a30"></a-sky>
  <a-entity starfield></a-entity>
  <!-- the moon -->
  <a-sphere position="-30 38 -60" radius="4" material="shader:flat; color:#f4ecd0"></a-sphere>
  <a-light type="ambient" color="#5a6a8f" intensity="0.55"></a-light>
  <a-light type="directional" color="#b8c4e8" intensity="0.45" position="-3 6 -4"></a-light>

  <!-- ground and the mossy stone path to the green door -->
  <a-circle radius="40" rotation="-90 0 0" color="#22381f"></a-circle>
  <a-entity id="path">
    <a-cylinder position="0 0.02 3.5" radius="0.42" height="0.04" color="#7d7a6e"></a-cylinder>
    <a-cylinder position="0.25 0.02 2.5" radius="0.38" height="0.04" color="#86837a"></a-cylinder>
    <a-cylinder position="-0.15 0.02 1.5" radius="0.4" height="0.04" color="#7a776c"></a-cylinder>
    <a-cylinder position="0.1 0.02 0.5" radius="0.36" height="0.04" color="#838076"></a-cylinder>
    <a-cylinder position="-0.1 0.02 -0.5" radius="0.4" height="0.04" color="#7d7a6e"></a-cylinder>
    <a-cylinder position="0.15 0.02 -1.5" radius="0.37" height="0.04" color="#86837a"></a-cylinder>
  </a-entity>

  <!-- THE COTTAGE -->
  <a-entity id="cottage" position="0 0 -5">
    <a-box width="6" height="2.8" depth="4.6" position="0 1.4 0" color="#d9cdb0"></a-box>
    <!-- thatched roof: two slopes -->
    <a-box width="6.6" height="0.25" depth="3.1" position="0 3.55 1.05" rotation="38 0 0" color="#6b4f33"></a-box>
    <a-box width="6.6" height="0.25" depth="3.1" position="0 3.55 -1.05" rotation="-38 0 0" color="#5f462d"></a-box>
    <a-box width="0.55" height="1.4" depth="0.55" position="1.9 4.1 -0.6" color="#8a6f5a"></a-box>
    <!-- the green door -->
    <a-box width="1.05" height="1.95" depth="0.08" position="0 0.98 2.32" color="#3d6b45"></a-box>
    <a-sphere radius="0.05" position="0.38 0.98 2.38" color="#c9a64a"></a-sphere>
    <a-light type="point" color="#ffb766" intensity="0.9" distance="7" position="0 2.3 2.9"></a-light>
    <a-sphere radius="0.09" position="0 2.15 2.42" material="shader:flat; color:#ffd59a"></a-sphere>
    <!-- warm windows -->
    <a-plane width="1.1" height="0.9" position="-1.8 1.65 2.31" material="shader:flat; color:#f2b65e"></a-plane>
    <a-plane width="1.1" height="0.9" position="1.8 1.65 2.31" material="shader:flat; color:#f2b65e"></a-plane>
    <a-box width="0.06" height="0.9" depth="0.04" position="-1.8 1.65 2.33" color="#5b4532"></a-box>
    <a-box width="0.06" height="0.9" depth="0.04" position="1.8 1.65 2.33" color="#5b4532"></a-box>
    <!-- window boxes -->
    <a-box width="1.2" height="0.18" depth="0.3" position="-1.8 1.12 2.45" color="#6e4f36"></a-box>
    <a-box width="1.2" height="0.18" depth="0.3" position="1.8 1.12 2.45" color="#6e4f36"></a-box>
    <!-- one small goose on the windowsill, keeping watch over the dark garden -->
    <a-entity position="1.35 1.28 2.48" scale="0.5 0.5 0.5">
      <a-sphere radius="0.13" scale="1.3 0.9 1" color="#f2efe6"></a-sphere>
      <a-cylinder radius="0.035" height="0.22" position="0.12 0.16 0" rotation="0 0 -20" color="#2a2a2a"></a-cylinder>
      <a-sphere radius="0.055" position="0.17 0.28 0" color="#2a2a2a"></a-sphere>
      <a-cone radius-bottom="0.025" radius-top="0" height="0.07" position="0.23 0.28 0" rotation="0 0 -90" color="#e0a13a"></a-cone>
    </a-entity>
  </a-entity>

  <!-- ARTEMIS the fox, sitting by the door with her sage-green ribbon -->
  <a-entity id="artemis" position="1.1 0 -2.2" rotation="0 -25 0">
    <a-sphere radius="0.28" scale="1 1.15 1.3" position="0 0.3 0" color="#b8582a"></a-sphere>
    <a-sphere radius="0.17" scale="1 1 1.1" position="0 0.62 0.12" color="#c4642f"></a-sphere>
    <a-sphere radius="0.1" scale="0.9 0.8 1.2" position="0 0.58 0.27" color="#efe3cf"></a-sphere>
    <a-sphere radius="0.025" position="0 0.6 0.38" color="#1c1410"></a-sphere>
    <a-sphere radius="0.022" position="-0.06 0.67 0.24" color="#1c1410"></a-sphere>
    <a-sphere radius="0.022" position="0.06 0.67 0.24" color="#1c1410"></a-sphere>
    <a-cone radius-bottom="0.06" radius-top="0" height="0.14" position="-0.09 0.8 0.08" color="#a94e24"></a-cone>
    <a-cone radius-bottom="0.06" radius-top="0" height="0.14" position="0.09 0.8 0.08" color="#a94e24"></a-cone>
    <a-torus radius="0.15" radius-tubular="0.02" position="0 0.5 0.06" rotation="80 0 0" color="#8fae86"></a-torus>
    <a-box width="0.06" height="0.07" depth="0.01" position="0 0.43 0.2" color="#a77b4f"></a-box>
    <a-sphere radius="0.13" scale="0.8 0.8 2.2" position="0.2 0.12 -0.32" rotation="0 30 0" color="#b8582a"></a-sphere>
    <a-sphere radius="0.07" position="0.33 0.12 -0.55" color="#f3ebdd"></a-sphere>
  </a-entity>

  <a-entity foxglove-beds></a-entity>

  <!-- the old tree and the bench just wide enough for two -->
  <a-entity position="-6.5 0 -1">
    <a-cylinder radius="0.35" height="3.2" position="0 1.6 0" color="#4a3524"></a-cylinder>
    <a-sphere radius="1.9" position="0 4 0" color="#1f3a22"></a-sphere>
    <a-sphere radius="1.4" position="1 3.4 0.6" color="#24442a"></a-sphere>
    <a-box width="1.5" height="0.08" depth="0.45" position="1.2 0.5 1.6" color="#6b5137"></a-box>
    <a-box width="1.5" height="0.4" depth="0.06" position="1.2 0.75 1.4" color="#6b5137"></a-box>
    <a-box width="0.08" height="0.5" depth="0.4" position="0.5 0.25 1.6" color="#5b4430"></a-box>
    <a-box width="0.08" height="0.5" depth="0.4" position="1.9 0.25 1.6" color="#5b4430"></a-box>
  </a-entity>

  <!-- the shed, glowing faint like it's been waiting -->
  <a-entity position="7 0 -6" rotation="0 -30 0">
    <a-box width="2.4" height="2" depth="2" position="0 1 0" color="#6f5a44"></a-box>
    <a-box width="2.7" height="0.15" depth="2.4" position="0 2.15 0" rotation="0 0 6" color="#4b3a2b"></a-box>
    <a-plane width="0.6" height="0.45" position="0.5 1.3 1.01" material="shader:flat; color:#d9b56a"></a-plane>
    <a-light type="point" color="#e8b867" intensity="0.35" distance="4" position="0.5 1.3 1.6"></a-light>
  </a-entity>

  <!-- the stone well, the moon caught in it like a coin already wished on -->
  <a-entity position="5 0 0.5">
    <a-torus radius="0.6" radius-tubular="0.16" position="0 0.45 0" rotation="90 0 0" color="#8b8a80"></a-torus>
    <a-cylinder radius="0.6" height="0.45" position="0 0.22 0" open-ended="true" color="#7c7b72" side="double"></a-cylinder>
    <a-circle radius="0.5" position="0 0.3 0" rotation="-90 0 0" color="#0b1220"></a-circle>
    <a-circle radius="0.08" position="0.12 0.31 -0.1" rotation="-90 0 0" material="shader:flat; color:#f4ecd0"></a-circle>
    <a-box width="0.08" height="1.4" depth="0.08" position="-0.62 1.1 0" color="#5b4430"></a-box>
    <a-box width="0.08" height="1.4" depth="0.08" position="0.62 1.1 0" color="#5b4430"></a-box>
    <a-box width="1.5" height="0.1" depth="0.6" position="0 1.85 0" rotation="0 0 0" color="#4b3a2b"></a-box>
  </a-entity>

  <!-- through the gate: the pond, the weather-grey dock, the creaky swing-bench -->
  <a-entity position="-4 0 9">
    <a-circle radius="3.2" position="0 0.03 0" rotation="-90 0 0" material="color:#1d3550; metalness:0.6; roughness:0.15"></a-circle>
    <a-circle radius="0.4" position="1.2 0.04 0.8" rotation="-90 0 0" color="#3d6b3a"></a-circle>
    <a-circle radius="0.32" position="-1 0.04 -1.1" rotation="-90 0 0" color="#467a40"></a-circle>
    <a-circle radius="0.28" position="0.4 0.04 -0.4" rotation="-90 0 0" color="#3d6b3a"></a-circle>
    <a-box width="0.9" height="0.08" depth="3" position="2.2 0.15 -0.6" rotation="0 -40 0" color="#8a8a82"></a-box>
    <a-entity position="4.2 0 -2.6" rotation="0 -40 0">
      <a-box width="0.08" height="2" depth="0.08" position="-0.8 1 0" color="#5b4430"></a-box>
      <a-box width="0.08" height="2" depth="0.08" position="0.8 1 0" color="#5b4430"></a-box>
      <a-box width="1.8" height="0.08" depth="0.08" position="0 2 0" color="#5b4430"></a-box>
      <a-box width="1.3" height="0.07" depth="0.4" position="0 0.55 0" color="#7a6247"></a-box>
      <a-box width="1.3" height="0.35" depth="0.05" position="0 0.75 -0.18" color="#7a6247"></a-box>
    </a-entity>
  </a-entity>
  <!-- silvered gate with its twine latch -->
  <a-entity position="-1.5 0 5.5" rotation="0 30 0">
    <a-box width="0.1" height="1.1" depth="0.1" position="-0.6 0.55 0" color="#a8a69c"></a-box>
    <a-box width="0.1" height="1.1" depth="0.1" position="0.6 0.55 0" color="#a8a69c"></a-box>
    <a-box width="1.2" height="0.08" depth="0.05" position="0 0.9 0" color="#b5b3a9"></a-box>
    <a-box width="1.2" height="0.08" depth="0.05" position="0 0.45 0" color="#b5b3a9"></a-box>
  </a-entity>

  <a-entity fireflies></a-entity>

  <!-- you arrive on the path, facing the green door -->
  <a-entity id="rig" position="0 0 5.5">
    <a-camera position="0 1.6 0" wasd-controls="acceleration:18" look-controls="pointerLockEnabled:false"></a-camera>
  </a-entity>
</a-scene>

<div class="card" id="card">
  <h1>The Foxglove Cottage</h1>
  <p>You're on the path at night, facing the green door. Artemis is waiting by the step. Drag to look around; on a computer, walk with W A S D. On the Quest, tap the goggles in the corner to step inside.</p>
  <button id="hide" type="button">Hide this note</button>
</div>
<script>document.getElementById('hide').addEventListener('click',()=>{ document.getElementById('card').hidden=true; });</script>

</body>
</html>
